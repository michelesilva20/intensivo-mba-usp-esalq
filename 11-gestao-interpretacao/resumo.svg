<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Gestão e interpretação</title><desc id="descricao">Leia o caso como uma decisão com objetivo, evidência e restrições.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 11</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Gestão e interpretação</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Leia o caso como uma decisão com objetivo, evidência e restrições.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">TRANSFORMAÇÃO E INOVAÇÃO</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Digitalizar papel é um passo.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Transformar redesenha processos e valor.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Valide a hipótese com um piloto e métricas.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">ÁGIL E SCRUM</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">PO: valor e ordenação do backlog.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">SM: efetividade do time e apoio ao Scrum.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Review: resultado. Retrospective: melhoria.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">LEGISLAÇÃO DIGITAL</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">LGPD: finalidade, base legal e dados mínimos.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Controlador decide. Operador atua em seu nome.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Marco Civil: direitos e deveres no uso da internet.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">BI E TI</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Defina KPI, grão, filtros e denominador.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Modele fatos, dimensões e qualidade.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Governança alinha decisões de TI à estratégia.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Entregas no prazo: (9 + 70) ÷ (10 + 100) = 71,8%.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
