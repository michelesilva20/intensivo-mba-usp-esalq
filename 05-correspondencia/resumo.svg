<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Análise de correspondência</title><desc id="descricao">Frequências → associação → representação em poucos eixos.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 05</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Análise de correspondência</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Frequências → associação → representação em poucos eixos.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">TABELA</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Simples: duas variáveis categóricas.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Múltipla: várias variáveis categóricas.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Compare perfis de categorias.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">INDEPENDÊNCIA</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Esperado = total da linha × total da coluna ÷ n.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">χ² = soma de (O − E)² ÷ E.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">O sinal de O − E indica excesso ou falta.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">EIXOS</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Inércia total da simples = χ² ÷ n.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Leia % por eixo, qualidade e contribuição.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">ACM usa matriz indicadora ou matriz de Burt.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">MAPA</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Observe direção e escala do mapa.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Confira associação cruzada com os resíduos.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Categoria rara pode aparecer muito distante.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Observado 30, esperado 20 → excesso de 10 naquela combinação.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
