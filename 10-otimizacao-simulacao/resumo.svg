<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Otimização e simulação</title><desc id="descricao">Otimização escolhe uma decisão. Simulação estima seus resultados.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 10</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Otimização e simulação</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Otimização escolhe uma decisão. Simulação estima seus resultados.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">MODELAGEM</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Variáveis representam escolhas.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Objetivo: maximize valor ou minimize custo.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Restrições representam limites reais.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">OTIMIZAÇÃO</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Solução viável respeita as restrições.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">Solução ótima melhora o objetivo ao máximo.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Inteiros e binários modelam escolhas discretas.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">SIMULAÇÃO</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Monte Carlo repete sorteios de entradas.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Eventos discretos representam filas e fluxos.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Leia média, percentis e risco de excedência.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">VERIFICAÇÃO</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Valide premissas e dependências.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Teste cenários e sensibilidade.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Mais sorteios reduzem ruído de amostragem.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">80% × R$ 100 + 20% × R$ 250 = custo esperado de R$ 130.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
