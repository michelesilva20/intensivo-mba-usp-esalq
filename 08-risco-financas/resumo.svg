<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Analytics e gestão de riscos</title><desc id="descricao">Identifique a exposição, dimensione a perda e escolha uma resposta.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 08</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Analytics e gestão de riscos</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Identifique a exposição, dimensione a perda e escolha uma resposta.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">TIPOS DE RISCO</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Crédito: contraparte não paga.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Mercado: preço, juros ou câmbio variam.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Operacional: falha de processo, gente ou sistema.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">PERDA ESPERADA</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">EL = PD × LGD × EAD.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">PD: chance de default. LGD: fração perdida.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">EAD: valor exposto no momento do default.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">CAUDA E CENÁRIOS</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">VaR é um quantil de perda em certo horizonte.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Expected Shortfall resume a cauda além do VaR.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Stress avalia cenários severos específicos.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">TRATAMENTO</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Evitar, reduzir, transferir ou aceitar.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Defina apetite e limites, acompanhe indicadores.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Reavalie exposição e eficácia dos controles.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">PD 2%, LGD 40%, EAD R$ 50.000 → perda esperada de R$ 400.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
