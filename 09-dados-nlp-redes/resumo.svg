<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Dados, texto e redes</title><desc id="descricao">A unidade de análise e a qualidade dos dados sustentam a conclusão.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 09</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Dados, texto e redes</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">A unidade de análise e a qualidade dos dados sustentam a conclusão.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">WRANGLING</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Tipos, faltantes, duplicatas e chaves.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">merge integra por chave. groupby agrega.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Cheque cardinalidade para evitar duplicação.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">COLETA WEB</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Crawler descobre URLs. Scraper extrai campos.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">Use fontes autorizadas e registre a origem.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Valide campos e mudanças no HTML.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">NLP E SENTIMENTO</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Tokenize e represente o texto.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">TF-IDF reduz peso de termos muito comuns.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Negação e ironia desafiam a classificação.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">ANÁLISE DE REDES</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Nós são entidades. Arestas são relações.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Grau = conexões. Betweenness = intermediação.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Closeness usa distâncias. Confira a direção.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Antes de agregar, confirme se cada linha é uma viagem, um evento ou um item.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
