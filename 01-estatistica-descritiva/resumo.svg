<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Estatística descritiva</title><desc id="descricao">Escolha a medida pelo tipo de variável e pelo formato dos dados.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 01</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Estatística descritiva</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Escolha a medida pelo tipo de variável e pelo formato dos dados.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">TIPO DE DADO</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Nominal: categoria sem ordem.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Ordinal: categoria com ordem.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Discreta: contagem. Contínua: medida.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">CENTRO</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Média = soma ÷ n.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">Mediana = posição central após ordenar.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Moda = valor ou categoria mais frequente.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">DISPERSÃO</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Amplitude = máximo − mínimo.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Variância usa desvios ao quadrado.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">DP = √variância, na unidade original.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">POSIÇÃO E GRÁFICOS</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">IQR = Q3 − Q1. Cercas: Q1 − 1,5 IQR</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">e Q3 + 1,5 IQR. Histograma para medidas.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Boxplot mostra mediana, quartis e extremos.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Salários 2, 2, 3, 3, 20 → média 6 e mediana 3.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
