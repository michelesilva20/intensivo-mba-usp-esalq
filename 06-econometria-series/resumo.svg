<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Regressões e séries temporais</title><desc id="descricao">O tipo da resposta define o modelo. A ordem define a validação.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 06</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Regressões e séries temporais</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">O tipo da resposta define o modelo. A ordem define a validação.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">Y CONTÍNUA • MQO</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">ŷ = β₀ + soma de βⱼxⱼ.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Dummy compara com a categoria-base.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">t: coeficiente. F: teste conjunto.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">DIAGNÓSTICOS</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Resíduos: gráfico e normalidade para inferência.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">VIF: colinearidade. BP: variância não constante.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Box-Cox transforma. Stepwise seleciona.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">OUTRAS RESPOSTAS</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Binária: p = 1 ÷ (1 + e⁻ᶻ).</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Multinomial: compare com a categoria-base.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Contagem: μ = eᶻ. NB acomoda superdispersão.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">ESTRUTURAS E TEMPO</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Excesso de zeros: investigue dois processos.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Grupos: considere efeitos multinível.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Tempo: nível, tendência, sazonalidade e erro.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Holt inclui tendência. Holt-Winters inclui sazonalidade. Valide em ordem temporal.</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
