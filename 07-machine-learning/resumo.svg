<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif"><title id="titulo">Árvores, ensembles e redes</title><desc id="descricao">Escolha o modelo e confira a qualidade fora do treino.</desc><rect width="1200" height="675" fill="#edf3f8"/><rect width="1200" height="155" fill="#102c43"/><text x="40" y="35" font-size="17" fill="#72d8bb" font-weight="700">INTENSIVO MBA   /   GUIA 07</text><text x="40" y="91" font-size="46" fill="#ffffff" font-weight="700">Árvores, ensembles e redes</text><text x="40" y="128" font-size="21" fill="#dbedf5" font-weight="400">Escolha o modelo e confira a qualidade fora do treino.</text><rect x="40" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="218" r="15" fill="#e2f4ef"/><text x="68" y="224" font-size="16" fill="#006959" font-weight="700">1</text><text x="100" y="225" font-size="18" fill="#006959" font-weight="700">ÁRVORE</text><text x="63" y="258" font-size="19" fill="#162d42" font-weight="400">Divisões reduzem impureza ou erro.</text><text x="63" y="285" font-size="19" fill="#162d42" font-weight="400">Mais profundidade aumenta flexibilidade.</text><text x="63" y="312" font-size="19" fill="#162d42" font-weight="400">Poda e limites de folhas controlam ajuste.</text><rect x="610" y="185" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="218" r="15" fill="#e2f4ef"/><text x="638" y="224" font-size="16" fill="#006959" font-weight="700">2</text><text x="670" y="225" font-size="18" fill="#006959" font-weight="700">ENSEMBLES</text><text x="633" y="258" font-size="19" fill="#162d42" font-weight="400">Bagging treina em reamostras e agrega.</text><text x="633" y="285" font-size="19" fill="#162d42" font-weight="400">Random Forest também sorteia variáveis.</text><text x="633" y="312" font-size="19" fill="#162d42" font-weight="400">Boosting corrige erros em sequência.</text><rect x="40" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="74" cy="396" r="15" fill="#e2f4ef"/><text x="68" y="402" font-size="16" fill="#006959" font-weight="700">3</text><text x="100" y="403" font-size="18" fill="#006959" font-weight="700">REDES NEURAIS</text><text x="63" y="436" font-size="19" fill="#162d42" font-weight="400">Camadas transformam as entradas.</text><text x="63" y="463" font-size="19" fill="#162d42" font-weight="400">Ativação introduz não linearidade.</text><text x="63" y="490" font-size="19" fill="#162d42" font-weight="400">Loss mede erro. Otimizador atualiza pesos.</text><rect x="610" y="363" width="550" height="158" rx="16" fill="#fff" stroke="#cbd9e5"/><circle cx="644" cy="396" r="15" fill="#e2f4ef"/><text x="638" y="402" font-size="16" fill="#006959" font-weight="700">4</text><text x="670" y="403" font-size="18" fill="#006959" font-weight="700">VALIDAÇÃO</text><text x="633" y="436" font-size="19" fill="#162d42" font-weight="400">Classificação: precisão, recall, F1, ROC/PR.</text><text x="633" y="463" font-size="19" fill="#162d42" font-weight="400">Regressão: MAE ou RMSE na unidade de Y.</text><text x="633" y="490" font-size="19" fill="#162d42" font-weight="400">Separe teste e ajuste. Cuidado com vazamento.</text><rect x="40" y="548" width="1120" height="74" rx="13" fill="#153c55"/><text x="61" y="593" font-size="21" fill="#ffffff" font-weight="600">Precisão = VP ÷ (VP + FP). Recall = VP ÷ (VP + FN).</text><text x="40" y="651" font-size="15" fill="#3c5a70" font-weight="600">RESUMO VISUAL   •   Leia o guia para ver exemplos resolvidos e exercícios.</text></svg>
